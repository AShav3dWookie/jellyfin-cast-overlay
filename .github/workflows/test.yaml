name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: .NET unit tests
        run: scripts/dotnet.sh test Jellyfin.Plugin.CastOverlay.slnx
      - name: Client script unit tests
        run: scripts/test-client.sh

  e2e:
    runs-on: ubuntu-24.04
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        jellyfin: ['12.3', '12.4']
    steps:
      - uses: actions/checkout@v5
      - name: End-to-end tests
        run: e2e/run.sh
        env:
          JELLYFIN: ${{ matrix.jellyfin }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.jellyfin }}
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
