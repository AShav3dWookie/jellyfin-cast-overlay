name: cast-overlay-e2e

services:
  jellyfin:
    image: jellyfin/jellyfin:12.3.20261023-013714
    volumes:
      - ./.state/config:/config
      - ./.state/cache:/cache
      - ./.state/media:/media:ro
    ports:
      # Exposed for debugging a run by hand; tests talk to the container directly.
      - "${E2E_PORT:-8197}:8096"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8096/health"]
      interval: 2s
      timeout: 5s
      retries: 90

  playwright:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    depends_on:
      jellyfin:
        condition: service_healthy
    working_dir: /e2e
    ipc: host
    environment:
      JELLYFIN_URL: http://jellyfin:8096
      CI: "1"
    volumes:
      - ./:/e2e
      - e2e-node-modules:/e2e/node_modules
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx playwright test"]

volumes:
  e2e-node-modules:
